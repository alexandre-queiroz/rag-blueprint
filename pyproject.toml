[project]
name = "rag-production"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.0.0",
    "httpx>=0.27.0",
    "litellm>=1.40.0",
    "pybreaker>=1.2.0",
    "python-dotenv>=1.0.0",
    "redis>=5.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
eval = [
    "ragas>=0.2.0",
    "datasets>=2.0.0",
    "langchain-google-genai>=2.0.0",
]
monitoring = [
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: marks tests that require real infrastructure credentials (select with --integration)",
]
